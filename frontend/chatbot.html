<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MindCare AI - Chatbot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f7f5ff,
                #eef2ff
            );
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            color: #6257ff;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #6257ff;
            background: #eeeaff;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .chat-card {
            background: white;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(70,60,120,0.1);
            overflow: hidden;
        }

        .chat-header {
            padding: 25px;
            background: linear-gradient(
                135deg,
                #6257ff,
                #806cff
            );
            color: white;
        }

        .chat-header h1 {
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
        }

        .chat-body {
            height: 500px;
            overflow-y: auto;
            padding: 25px;
            background: #fafaff;
        }

        .message-row {
            display: flex;
            margin-bottom: 18px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message-row.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #eee;
            border-bottom-left-radius: 4px;
        }

        .message-row.user .message-bubble {
            background: #6257ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            display: block;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.6;
        }

        .chat-input-area {
            padding: 18px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: white;
        }

        #chatInput {
            flex: 1;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
        }

        #chatInput:focus {
            border-color: #6257ff;
            box-shadow: 0 0 0 3px rgba(98,87,255,0.1);
        }

        #sendBtn {
            width: 110px;
            border: none;
            border-radius: 12px;
            background: #6257ff;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        #sendBtn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .history-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .history-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #6257ff;
            border: 1px solid #6257ff;
        }

        .history-btn:hover {
            background: #eeeaff;
        }

        .empty-chat {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 3%;
            }

            .nav-links a {
                font-size: 12px;
                padding: 8px;
            }

            .chat-body {
                height: 55vh;
            }

            .message-bubble {
                max-width: 88%;
            }

            .chat-input-area {
                flex-direction: column;
            }

            #sendBtn {
                width: 100%;
                height: 48px;
            }
        }

    </style>

</head>

<body>

<nav class="navbar">

    <a
        href="dashboard.html"
        class="brand"
    >
        🧠 MindCare AI
    </a>

    <div class="nav-links">

        <a href="dashboard.html">
            Home
        </a>

        <a href="mood.html">
            Mood
        </a>

        <a
            href="chatbot.html"
            class="active"
        >
            Chat
        </a>

        <a href="profile.html">
            Profile
        </a>

    </div>

</nav>


<main class="container">

    <div class="chat-card">

        <div class="chat-header">

            <h1>
                💬 MindCare AI
            </h1>

            <p>
                Talk to your AI mental wellness companion.
            </p>

        </div>


        <div
            id="chatBody"
            class="chat-body"
        ></div>


        <div class="chat-input-area">

            <input
                type="text"
                id="chatInput"
                name="chatInput"
                placeholder="Type how you're feeling..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
                type="button"
            >
                Send
            </button>

        </div>

    </div>


    <div class="history-actions">

        <button
            id="clearHistoryBtn"
            class="history-btn"
            type="button"
        >
            Clear Chat History
        </button>

        <button
            id="homeBtn"
            class="history-btn"
            type="button"
        >
            🏠 Home
        </button>

    </div>

</main>


<script src="./js/chatbot.js"></script>

</body>

</html>
